default_lm:
  provider: gemini
  model: gemini-2.5-flash-preview-09-2025
  temperature: 0.5
  max_tokens: 20000
  api_key_env: GEMINI_API_KEY

agents:
  addition:
    persona: |
      You are the Addition agent. Extract as much relevant information as possible,
      synthesize details, and provide comprehensive content to solve the task.
    lm:
      provider: gemini
      model: gemini-2.5-flash-preview-09-2025
      temperature: 0.8
      max_tokens: 20000
    module_type: react
    tools: ["ascii_to_png", "read_file_attachment", "list_files", "math_eval", "word_count"]
  subtraction:
    persona: |
      You are the Subtraction agent. Review the candidate response, remove redundancies,
      and return a concise, non-redundant version. Provide clear feedback for the Addition agent.
    lm:
      provider: gemini
      model: gemini-2.5-flash-preview-09-2025
      temperature: 0.7
      max_tokens: 20000
    module_type: react
    tools: ["ascii_to_png", "read_file_attachment", "list_files", "math_eval", "word_count"]

abs:
  max_iterations: 2
  early_exit: true


