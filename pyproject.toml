[project]
name = "dspy-agents"
version = "0.1.0"
description = "Best agents"
authors = [
    {name = "Michael Pavlukhin",email = "michael@pavlukhinlab.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dspy (>=3.0.3,<4.0.0)",
    "typer (>=0.19.2,<0.20.0)",
    "rich (>=14.2.0,<15.0.0)",
    "pydantic (>=2.8,<3.0)",
    "pyyaml (>=6.0.1,<7.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "questionary (>=2.0.1,<3.0.0)",
    "structlog (>=25.4.0,<26.0.0)",
    "attachments (>=0.25.1,<0.26.0)"
]


[project.scripts]
dspy-agents = "awesome_dspy_agents.cli:app"

[tool.poetry]
packages = [
    { include = "awesome_dspy_agents" },
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
